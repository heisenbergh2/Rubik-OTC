---
name: Tests - Lua

on:
  workflow_call:

jobs:
  job:
    name: Run Lua Tests
    runs-on: ubuntu-latest

    steps:
      - name: Update
        run: sudo apt-get update

      - name: Setup Lua
        run: sudo apt-get install -y lua5.1 liblua5.1-0-dev

      - name: Check out code.
        uses: actions/checkout@v7

      - name: Test OTUI editor parsing and edit safety
        run: lua5.1 tests/lua/dev_otui_test.lua

      - name: Test login loading-screen lifecycle
        run: lua5.1 tests/lua/login_transition_test.lua

      - name: Test options and runtime packaging contracts
        run: lua5.1 tests/lua/options_contract_test.lua
