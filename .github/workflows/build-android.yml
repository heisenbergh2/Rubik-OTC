name: Build - Android

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rubikotc-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      VCPKG_MAX_CONCURRENCY: 2
      LUAJIT_COMMIT: d0e88930ddde28ff662503f9f20facf34f7265aa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf autoconf-archive automake \
            build-essential ccache gcc-multilib g++-multilib libtool ninja-build \
            pkg-config nasm gperf bison flex zip unzip
      - name: Set up Android SDK tools
        # setup-android adds sdkmanager to PATH on runners where it is absent.
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1 (Node 24)
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Read pinned toolchains
        id: baseline
        run: |
          baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$baseline" >> "$GITHUB_OUTPUT"
          ndk=$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          test -n "$ndk"
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          mkdir -p .cache/vcpkg "$CCACHE_DIR"
      - name: Install Android SDK components
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/otclient/MainActivity.kt
          sdkmanager "ndk;${{ steps.baseline.outputs.ndk }}" 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore compiled Android dependencies
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/vcpkg
            vcpkg/downloads
          key: android-deps-${{ steps.baseline.outputs.ndk }}-${{ hashFiles('vcpkg.json') }}-complete-v1
          restore-keys: |
            android-deps-${{ steps.baseline.outputs.ndk }}-${{ hashFiles('vcpkg.json') }}-
            android-deps-${{ steps.baseline.outputs.ndk }}-
            android-native-${{ steps.baseline.outputs.ndk }}-${{ hashFiles('vcpkg.json') }}-
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: ccache
          max-size: 500M
          key: android-${{ steps.baseline.outputs.ndk }}
      - name: Install pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ steps.baseline.outputs.commit }}
          vcpkgJsonGlob: vcpkg.json
      - name: Select persisted binary cache
        run: |
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/.cache/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.cache/vcpkg,readwrite" >> "$GITHUB_ENV"
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Cache LuaJIT for all four Android architectures
        id: luajit
        uses: actions/cache@v6
        with:
          path: |
            android/app/libs/include/luajit
            android/app/libs/lib
          key: luajit-android-${{ env.LUAJIT_COMMIT }}-${{ steps.baseline.outputs.ndk }}-${{ hashFiles('build_luajit_android.sh') }}
      - name: Build LuaJIT
        if: steps.luajit.outputs.cache-hit != 'true'
        run: |
          git clone --no-checkout https://github.com/LuaJIT/LuaJIT.git luajit-src
          git -C luajit-src checkout "$LUAJIT_COMMIT"
          bash build_luajit_android.sh
      - name: Prepare assets and development signing key
        run: |
          mkdir -p android/app/src/main/assets "$HOME/.android"
          zip -qr android/app/src/main/assets/data.zip assets mods modules init.lua otclientrc.lua
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build APK
        id: apk
        working-directory: android
        run: |
          # vcpkg must download its supported CMake, rather than being forced to
          # use Gradle's older 3.22 CMake for modern vcpkg port metadata.
          unset VCPKG_FORCE_SYSTEM_BINARIES
          bash gradlew --no-daemon --max-workers=2 --build-cache assembleRelease
      - name: Save completed dependency work even on failure
        if: ${{ always() && steps.baseline.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/vcpkg
            vcpkg/downloads
          key: android-deps-${{ steps.baseline.outputs.ndk }}-${{ hashFiles('vcpkg.json') }}-${{ steps.apk.outcome == 'success' && 'complete-v1' || format('{0}-{1}', github.run_id, github.run_attempt) }}
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Upload development-signed APK
        uses: actions/upload-artifact@v7
        with:
          name: RubikOTC-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload dependency diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-android
          path: |
            android/app/.cxx/**/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
