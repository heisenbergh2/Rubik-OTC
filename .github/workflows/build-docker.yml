name: Reusable Docker build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Image Build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image and export runtime filesystem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          outputs: type=local,dest=artifacts/docker-rootfs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: rubikotc:ci
      - name: Upload Docker runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: RubikOTC-docker
          path: artifacts/docker-rootfs/otclient
          if-no-files-found: error
          retention-days: 14
